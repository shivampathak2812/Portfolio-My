name: 🌌 Shivam Pathak Portfolio — CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # Job 1: Frontend Lint, Compile, and Build
  # ==========================================
  frontend-ci:
    name: 💻 Frontend CI (Node/Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clone Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Frontend Dependencies
        run: npm ci

      - name: 🧹 Run ESLint Validation
        run: npm run lint

      - name: 🔍 Run TypeScript Check
        run: npx tsc --noEmit

      - name: 🚀 Compile Production Build
        run: npm run build
        env:
          # Prevent build from failing on missing backend environment keys in local configurations
          NEXT_PUBLIC_API_URL: "http://localhost:8000"

  # ==========================================
  # Job 2: Backend Syntax & Dependency Verification
  # ==========================================
  backend-ci:
    name: 🐍 Backend CI (Python/FastAPI)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clone Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 🔍 Verify Python Compilation & Syntax
        run: |
          python -m py_compile backend/main.py backend/ingest.py backend/rag_engine.py backend/prompts.py
